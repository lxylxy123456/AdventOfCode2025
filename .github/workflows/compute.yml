name: Compute all the answers

on: ["push", "pull_request"]

jobs:
  compute:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Pip
      run: |
        pip3 install scipy
    - name: Compute
      run: |
        for i in d*; do
          time ./compute.sh $i
        done

